<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI 原生业务操作系统三受众推广架构演示">
  <title>AI 原生业务操作系统｜三受众架构演示</title>
  <style>
    :root {
      color-scheme: light;
      --canvas-cream: #F3EFE5;
      --canvas: #F3EFE5;
      --surface-paper: #FBF8F1;
      --ink: #171D24;
      --muted: #69675F;
      --line: #D8D0C1;
      --line-strong: #B7AE9E;
      --qiyun-deep: var(--canvas-cream);
      --token-violet: #7200FF;
      --decision-red: #D92B55;
      --value-gold: #C58A00;
      --drive-cyan: #079C94;
      --paper-white: var(--ink);
      --ocean-0: var(--canvas-cream);
      --ocean-1: var(--surface-paper);
      --ocean-2: #EAE3D6;
      --paper: var(--ink);
      --execution: var(--token-violet);
      --execution-soft: rgba(114, 0, 255, .13);
      --trust: var(--drive-cyan);
      --trust-soft: rgba(7, 156, 148, .12);
      --trust-text: #006B65;
      --human: var(--value-gold);
      --human-soft: rgba(197, 138, 0, .12);
      --human-text: #765000;
      --value: var(--token-violet);
      --value-soft: rgba(114, 0, 255, .14);
      --danger: var(--decision-red);
      --content: 1240px;
      --pad: clamp(20px, 4vw, 64px);
      --display: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --body: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --utility: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--ocean-0); }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--paper);
      background:
        linear-gradient(rgba(183,174,158,.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(183,174,158,.10) 1px, transparent 1px),
        var(--canvas-cream);
      background-size: 48px 48px, 48px 48px, auto;
      font: 400 16px/1.7 var(--body);
      overflow-x: hidden;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--human-text); outline-offset: 3px; }
    .shell { width: min(100%, var(--content)); margin: 0 auto; padding: 0 var(--pad); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(251,248,241,.94);
      backdrop-filter: blur(18px);
    }
    .topbar-inner { min-height: 74px; display: flex; gap: 24px; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; white-space: nowrap; min-width: 0; }
    .qiyun-logo { display: block; width: 164px; height: 54px; object-fit: contain; object-position: left center; }
    .audience-tabs { display: flex; gap: 6px; padding: 5px; border: 1px solid var(--line); background: var(--canvas-cream); }
    .audience-tab, .mode-button, .chapter-button, .nav-button {
      border: 1px solid transparent;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .audience-tab { min-height: 42px; padding: 8px 16px; }
    .audience-tab[aria-selected="true"] { color: var(--ink); border-color: var(--token-violet); background: linear-gradient(90deg, rgba(217,43,85,.10), rgba(114,0,255,.12), rgba(7,156,148,.09)); }
    .hero { min-height: 650px; display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, .85fr); gap: clamp(38px, 6vw, 88px); align-items: center; padding-block: clamp(72px, 10vw, 140px) 72px; }
    .hero-copy { align-self: end; }
    .hero-statement { align-self: end; padding: 28px 0 4px 26px; border-left: 2px solid var(--trust); }
    .hero-loop-summary { grid-column: 1 / -1; align-self: start; }
    .eyebrow { margin: 0 0 16px; color: var(--execution); font: 500 12px/1.4 var(--utility); letter-spacing: .2em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 780px; margin-bottom: 20px; font: 700 clamp(44px, 6vw, 78px)/1.08 var(--display); letter-spacing: -.035em; }
    .brand-concept { margin: 0 0 8px; font: 700 clamp(30px, 4vw, 54px)/1.15 var(--display); letter-spacing: -.02em; }
    .brand-positioning { margin: 0 0 8px; color: var(--paper); font-size: clamp(18px, 2vw, 26px); font-weight: 600; }
    .brand-english { margin: 0 0 34px; color: var(--muted); font: 500 12px/1.3 var(--utility); letter-spacing: .18em; text-transform: uppercase; }
    .hero-lead { max-width: 690px; color: var(--ink); font-size: clamp(18px, 2vw, 23px); line-height: 1.75; }
    .hero-closing { margin: 0; color: var(--muted); font: 600 clamp(20px, 2.2vw, 30px)/1.5 var(--display); }
    .hero-map { min-height: 0; display: grid; place-items: center; }
    .hero-flow-svg { display: block; width: 100%; height: auto; overflow: visible; }
    .hero-flow-mobile { display: none; width: 100%; }
    .hero-flow-mobile .mobile-flow-stage { position: relative; padding: 15px 14px; border: 1px solid var(--token-violet); background: var(--surface-paper); text-align: center; }
    .hero-flow-mobile .mobile-flow-stage + .mobile-flow-stage { margin-top: 24px; }
    .hero-flow-mobile .mobile-flow-stage + .mobile-flow-stage::before { content: "↓  词元流"; position: absolute; left: 50%; top: -22px; transform: translateX(-50%); color: var(--trust-text); font: 500 11px/1 var(--utility); white-space: nowrap; }
    .hero-flow-mobile .mobile-flow-stage.human { border-color: var(--value-gold); }
    .hero-flow-mobile .mobile-flow-stage.result { border: 3px double var(--token-violet); }
    .hero-flow-mobile small { display: block; margin-top: 5px; color: var(--muted); }
    .hero-flow-mobile .mobile-governance { margin-top: 18px; padding-top: 12px; border-top: 2px solid var(--drive-cyan); color: var(--trust-text); font-size: 12px; text-align: center; }
    .hero-flow-mobile .mobile-return { margin-top: 14px; color: var(--token-violet); font-size: 13px; text-align: center; }
    .hero-flow-svg text { fill: var(--paper); font-family: var(--body); font-size: 13px; }
    .hero-flow-svg .muted-svg { fill: var(--muted); font-size: 11px; }
    .token-flow { fill: none; stroke: url(#qiyun-gradient); stroke-width: 3; marker-end: url(#hero-arrow); }
    .feedback-return { fill: none; stroke: var(--token-violet); stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#hero-return-arrow); }
    .human-gate { fill: var(--human-soft); stroke: var(--value-gold); }
    .verified-result { fill: rgba(114,0,255,.12); stroke: var(--token-violet); stroke-width: 3; }
    .marker-trust { fill: var(--drive-cyan); }
    .marker-value { fill: var(--token-violet); }
    .hero-result-inner { fill: none; stroke: var(--token-violet); }
    .loop-band { padding: 34px 0 48px; border-block: 1px solid var(--line); background: transparent; }
    .loop-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
    .loop-heading h2 { margin: 0; font: 500 20px/1.3 var(--body); }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; }
    .legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; margin-right: 6px; vertical-align: middle; background: currentColor; }
    .legend .lg-execution { color: var(--execution); }
    .legend .lg-trust { color: var(--trust-text); }
    .legend .lg-human { color: var(--human-text); }
    .legend .lg-value { color: var(--value); }
    .loop-svg { display: block; width: 100%; height: auto; overflow: visible; }
    .loop-svg text { font-family: var(--body); fill: var(--paper); }
    .loop-svg .small { fill: var(--muted); font-family: var(--utility); font-size: 11px; letter-spacing: .08em; }
    .loop-svg .track { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
    .loop-svg .return { fill: none; stroke: var(--value); stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow-value); }
    .loop-svg .node { fill: var(--surface-paper); stroke: var(--execution); stroke-width: 1.25; }
    .loop-svg .node-trust { stroke: var(--trust); }
    .loop-svg .node-human { stroke: var(--human); }
    .loop-svg .node-result-svg { stroke: var(--value); stroke-width: 1.5; }
    .loop-svg .result-inner { fill: none; stroke: var(--value); stroke-width: 1; pointer-events: none; }
    .loop-svg .node-value { stroke: var(--value); stroke-width: 2; }
    .loop-mobile { display: none; }
    .workspace-bar { position: sticky; top: 74px; z-index: 18; border-bottom: 1px solid var(--line); background: rgba(251,248,241,.96); backdrop-filter: blur(16px); }
    .workspace-inner { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; min-height: 70px; }
    .chapter-nav { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
    .chapter-button { flex: 0 0 auto; padding: 10px 12px; font-size: 13px; border-bottom-color: transparent; }
    .chapter-button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--execution); background: var(--execution-soft); }
    .controls { display: flex; gap: 6px; align-items: center; }
    .mode-button, .nav-button { min-height: 38px; padding: 7px 12px; border-color: var(--line); }
    .mode-button[aria-pressed="true"] { color: var(--ink); border-color: var(--trust); background: var(--trust-soft); }
    .nav-button:disabled { opacity: .35; cursor: not-allowed; }
    main { padding-bottom: 88px; }
    .chapter { min-height: 720px; display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: clamp(18px, 2vw, 28px); align-content: center; padding-block: clamp(88px, 10vw, 144px); border-bottom: 1px solid var(--line); animation: chapter-in .35s ease both; }
    .chapter-copy { grid-column: 1 / span 4; align-self: center; }
    .chapter-visual { grid-column: 5 / -1; min-width: 0; padding-left: clamp(0px, 2vw, 24px); }
    .chapter-index { color: var(--muted); font: 500 12px/1 var(--utility); letter-spacing: .16em; }
    .chapter h2 { margin: 12px 0 20px; font: 700 clamp(32px, 4.4vw, 56px)/1.15 var(--display); letter-spacing: -.025em; }
    .thesis { color: var(--ink); font-size: 18px; }
    .value-list { display: grid; gap: 12px; margin: 30px 0; padding: 0; list-style: none; }
    .value-list li { position: relative; padding: 11px 0 11px 28px; border-top: 1px solid var(--line); color: var(--muted); }
    .value-list li::before { content: ""; position: absolute; left: 2px; top: 19px; width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid var(--trust); }
    .chapter-transition { margin-top: 28px; color: var(--execution); font-size: 14px; }
    [data-transition]::after { content: "  →"; }
    .diagram { position: relative; min-height: 460px; display: grid; place-items: center; padding: clamp(40px, 4vw, 56px); border: 1px solid var(--line); background: var(--surface-paper); box-shadow: 0 12px 30px rgba(23,29,36,.06); overflow: hidden; }
    .diagram-label { position: absolute; top: 20px; left: 24px; color: var(--muted); font: 500 10px/1.2 var(--utility); letter-spacing: .18em; text-transform: uppercase; }
    .diagram-grid { width: 100%; display: grid; gap: 12px; position: relative; z-index: 1; }
    .node-box { position: relative; min-height: 72px; display: grid; place-content: center; padding: 14px; text-align: center; color: var(--ink); border: 1px solid var(--line-strong); background: var(--surface-paper); }
    .node-box small { color: var(--muted); }
    .node-execution { border-color: var(--execution); background: var(--execution-soft); }
    .node-trust { border-color: var(--trust); background: var(--trust-soft); }
    .node-human { border-color: var(--human); background: var(--human-soft); }
    .node-result { border: 3px double var(--value); background: var(--value-soft); }
    .arrow { color: var(--execution); text-align: center; font-size: 24px; line-height: 1; }
    .paradigm-grid { grid-template-columns: 1fr 54px 1.25fr; align-items: center; }
    .state-stack { display: grid; gap: 8px; }
    .state-stack.muted { opacity: .65; }
    .state-title { color: var(--muted); font: 500 11px/1.2 var(--utility); letter-spacing: .13em; text-transform: uppercase; text-align: center; }
    .friction-grid { grid-template-columns: repeat(4, 1fr) 48px 1.35fr; align-items: center; }
    .friction-source { min-height: 96px; }
    .friction-target { grid-column: 6; grid-row: 1; min-height: 132px; }
    .converge { color: var(--execution); text-align: center; font: 500 12px/1.3 var(--utility); }
    .architecture-grid { grid-template-columns: 1fr; align-items: stretch; }
    .architecture-boundaries { display: flex; justify-content: space-between; gap: 18px; padding-bottom: 10px; color: var(--muted); border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: .08em; }
    .layer-stack { display: grid; gap: 9px; }
    .layer { padding: 16px; border: 1px solid var(--line-strong); background: var(--surface-paper); }
    .layer strong { display: block; font-weight: 500; }
    .layer span { color: var(--muted); font-size: 13px; }
    .layer-core { border-color: var(--execution); background: var(--execution-soft); }
    .layer-foundation { border-color: var(--trust); background: var(--trust-soft); }
    .cap-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; margin-top: 10px; }
    .cap-row span { padding: 8px 5px; border: 1px solid var(--line); color: var(--ink); text-align: center; font-size: 12px; }
    .execution-grid { grid-template-columns: 1fr 32px 1fr 32px 78px 32px 1fr 32px 1fr; align-items: center; }
    .execution-grid .governance { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; border-top: 2px solid var(--trust); padding-top: 12px; }
    .gate { width: 54px; height: 54px; margin: 0 auto; display: grid; place-content: center; transform: rotate(45deg); border: 1px solid var(--human); background: var(--ocean-1); }
    .gate span { transform: rotate(-45deg); font-size: 11px; color: var(--human-text); }
    .flywheel { width: min(470px,100%); aspect-ratio: 1; position: relative; border: 1px solid var(--line-strong); border-radius: 50%; }
    .flywheel::before { content: ""; position: absolute; inset: 15%; border: 1px solid rgba(114,0,255,.34); border-radius: 50%; }
    .flywheel-core { position: absolute; inset: 34%; display: grid; place-content: center; text-align: center; border: 1px solid var(--execution); background: var(--ocean-1); }
    .wheel-node { position: absolute; width: 120px; min-height: 64px; display: grid; place-content: center; text-align: center; padding: 8px; background: var(--ocean-1); border: 1px solid var(--line-strong); font-size: 13px; }
    .wheel-node:nth-child(2) { left: 50%; top: -3%; transform: translateX(-50%); }
    .wheel-node:nth-child(3) { right: -8%; top: 28%; border-color: var(--execution); }
    .wheel-node:nth-child(4) { right: 2%; bottom: 4%; border-color: var(--value); }
    .wheel-node:nth-child(5) { left: 2%; bottom: 4%; border-color: var(--trust); }
    .wheel-node:nth-child(6) { left: -8%; top: 28%; border-color: var(--human); }
    .wheel-arrow { position: absolute; color: var(--value); font-size: 25px; }
    .wa1 { top: 11%; right: 14%; transform: rotate(40deg); }
    .wa2 { right: 4%; bottom: 27%; transform: rotate(90deg); }
    .wa3 { bottom: 8%; left: 46%; transform: rotate(175deg); }
    .wa4 { left: 4%; bottom: 27%; transform: rotate(245deg); }
    .wa5 { top: 11%; left: 14%; transform: rotate(320deg); }
    .value-grid { grid-template-columns: 1fr 1.25fr; align-items: stretch; }
    .result-stack { display: grid; gap: 8px; }
    .value-ladder { display: grid; gap: 0; align-content: end; }
    .value-rung { margin-inline: auto; padding: 14px; text-align: center; border: 1px solid var(--value); background: var(--surface-paper); }
    .value-rung small { display: block; margin-top: 4px; color: var(--muted); }
    .value-rung:nth-child(1) { width: 62%; }
    .value-rung:nth-child(2) { width: 78%; }
    .value-rung:nth-child(3) { width: 94%; }
    .cta { margin: 80px 0 20px; display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: end; padding: clamp(28px,5vw,64px); border: 1px solid var(--value); background: linear-gradient(120deg, var(--value-soft), rgba(77,163,255,.08)); }
    .cta h2 { margin-bottom: 10px; font: 700 clamp(30px,4vw,52px)/1.18 var(--display); }
    .cta p { margin: 0; color: var(--ink); }
    .cta-action { padding: 13px 20px; color: var(--ink); border: 1px solid var(--value); background: var(--execution-soft); white-space: nowrap; }
    .edit-note { margin: 28px 0 0; padding: 16px 18px; border-left: 2px solid var(--human); color: var(--muted); background: rgba(241,184,75,.06); font-size: 13px; }
    .edit-note code { color: var(--human-text); }
    body[data-mode="present"] .chapter { display: none; min-height: calc(100vh - 144px); border-bottom: 0; }
    body[data-mode="present"] .chapter.is-active { display: grid; }
    body[data-mode="present"] .hero,
    body[data-mode="present"] .loop-band { display: none; }
    body[data-mode="present"] .cta { display: none; }
    @keyframes chapter-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (max-width: 980px) {
      .topbar-inner { align-items: flex-start; padding-block: 12px; flex-direction: column; }
      .audience-tabs { width: 100%; }
      .audience-tab { flex: 1; }
      .hero { grid-template-columns: 1fr; min-height: 0; }
      .hero-statement, .hero-loop-summary { grid-column: 1; }
      .hero-map { min-height: 0; margin-top: 18px; }
      .hero-flow-svg { display: none; }
      .hero-flow-mobile { display: block; }
      .workspace-bar { top: 113px; }
      .workspace-inner { grid-template-columns: 1fr; gap: 4px; padding-block: 8px; }
      .controls { justify-content: flex-end; }
      .chapter { grid-template-columns: 1fr; min-height: 0; }
      .chapter-copy, .chapter-visual { grid-column: 1; }
      .chapter-copy { max-width: 700px; }
      .chapter-visual { padding-left: 0; }
    }
    @media (max-width: 820px) {
      .loop-svg { display: none; }
      .loop-mobile { display: grid; gap: 0; }
      .loop-mobile-stage { position: relative; min-height: 66px; display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-left: 2px solid var(--token-violet); background: var(--surface-paper); }
      .loop-mobile-stage:not(:last-child)::after { content: "↓"; position: absolute; left: 12px; bottom: -14px; z-index: 2; color: var(--trust-text); }
      .loop-mobile-stage strong { color: var(--muted); font: 500 11px/1 var(--utility); }
      .loop-mobile-stage:nth-child(5) { border-left-color: var(--value-gold); }
      .loop-mobile-stage:nth-child(6) { border: 3px double var(--token-violet); }
      .loop-mobile-return { padding: 12px; text-align: center; color: var(--token-violet); border-top: 1px dashed var(--token-violet); }
      .paradigm-grid, .architecture-grid, .value-grid { grid-template-columns: 1fr; }
      .paradigm-grid > .arrow { transform: rotate(90deg); }
      .execution-grid { grid-template-columns: 1fr; }
      .execution-grid > .arrow { transform: rotate(90deg); }
      .execution-grid .governance { grid-template-columns: repeat(2,1fr); }
      .friction-grid { grid-template-columns: 1fr 1fr; }
      .friction-target { grid-column: 1 / -1; grid-row: auto; order: -1; min-height: 120px; }
      .cta { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      body { font-size: 15px; }
      .shell { padding-inline: 18px; }
      .brand small { display: none; }
      .audience-tabs { display: grid; grid-template-columns: 1fr; }
      .workspace-bar { position: static; }
      .chapter-nav { width: 100%; }
      .controls { justify-content: stretch; flex-wrap: wrap; }
      .controls button { flex: 1; }
      .hero { padding-top: 56px; }
      .hero-copy, .hero-statement, .hero-loop-summary { grid-column: 1; }
      .hero-statement { padding: 22px 0 0 18px; }
      .loop-heading { align-items: flex-start; flex-direction: column; }
      .chapter { padding-block: 68px; gap: 30px; }
      .diagram { min-height: 390px; padding: 42px 14px 20px; }
      .cap-row, .execution-grid .governance { grid-template-columns: 1fr 1fr; }
      .friction-grid { grid-template-columns: 1fr; }
      .flywheel { transform: scale(.72); }
      .value-rung:nth-child(n) { width: 100%; }
      .cta-action { white-space: normal; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body data-mode="browse">
  <header class="topbar">

      if (type === 'paradigm') return `<div class="diagram" role="img" aria-label="从寻找功能入口到围绕目标交付结果的完整闭环">${common}<div class="diagram-grid paradigm-grid"><div class="state-stack muted"><div class="state-title">过去：从功能入口开始</div><div class="node-box">找入口与功能</div><div class="node-box">搬运数据和状态</div><div class="node-box">人工追赶流程</div></div><div class="arrow">→</div><div class="state-stack"><div class="state-title">现在：从业务目标开始</div><div class="node-box node-execution">目标成为统一入口</div><div class="node-box node-trust">组织人、数据与能力</div><div class="node-box node-result">可验证结果 · 反馈回到目标</div></div></div></div>`;
      if (type === 'friction') return `<div class="diagram" role="img" aria-label="分散的功能入口和业务痛点沿细线汇聚到 TaaS 业务目标">${common}<div class="diagram-grid friction-grid"><div class="node-box friction-source">人员与岗位</div><div class="node-box friction-source">业务数据</div><div class="node-box friction-source">专业能力</div><div class="node-box friction-source">客户系统</div><div class="converge">────→</div><div class="node-box node-execution friction-target"><strong>TaaS 业务目标</strong><small>统一上下文 · 统一状态 · 统一下一步 · 结果回流</small></div></div></div>`;
      if (type === 'architecture') return `<div class="diagram" role="img" aria-label="体验入口、TaaS 智能执行层、能力网络和可信业务底座构成垂直四层架构">${common}<div class="diagram-grid architecture-grid"><div class="architecture-boundaries"><span>生态连接</span><span>灵活部署与数据边界</span></div><div class="layer-stack"><div class="layer"><strong>多元体验入口</strong><span>目标 · 事件 · 任务 · 协作</span></div><div class="layer layer-core"><strong>TaaS 智能执行层</strong><span>理解 · 规划 · 组织 · 执行 · 反馈</span></div><div class="layer"><strong>可组合业务能力网络</strong><div class="cap-row"><span>智能能力</span><span>业务服务</span><span>数据产品</span><span>行业扩展</span></div></div><div class="layer layer-foundation"><strong>可信业务底座</strong><span>身份 · 事实 · 证据 · 审批 · 价值 · 审计</span></div></div></div></div>`;
      if (type === 'execution') return `<div class="diagram" role="img" aria-label="目标沿单向流程经过关键人工守门形成结果，可信治理作为全程底轨">${common}<div class="diagram-grid execution-grid"><div class="node-box">可执行意图</div><div class="arrow">→</div><div class="node-box node-execution">理解与决策</div><div class="arrow">→</div><div class="gate human-gate"><span>关键人工守门</span></div><div class="arrow">→</div><div class="node-box node-execution">组织能力执行</div><div class="arrow">→</div><div class="node-box node-result verified-result">可验证结果</div><div class="governance"><div class="node-box node-trust">权限边界</div><div class="node-box node-trust">业务事实</div><div class="node-box node-human">关键审批</div><div class="node-box node-trust">证据审计</div></div></div></div>`;
      if (type === 'flywheel') return `<div class="diagram" role="img" aria-label="业务目标、运行交付、反馈评估、版本升级和新机会构成闭合飞轮">${common}<div class="flywheel"><div class="flywheel-core"><strong>${escapeHtml(data.shortLabel)}飞轮</strong><small>每轮都提高下一轮起点</small></div><div class="wheel-node">目标与需求</div><div class="wheel-node">运行与交付</div><div class="wheel-node">反馈与结果</div><div class="wheel-node">评估与新版本</div><div class="wheel-node">人工验证</div><span class="wheel-arrow wa1">↘</span><span class="wheel-arrow wa2">↓</span><span class="wheel-arrow wa3">←</span><span class="wheel-arrow wa4">↑</span><span class="wheel-arrow wa5">↗</span></div></div>`;
      return `<div class="diagram" role="img" aria-label="证据支撑可验证结果并形成递进业务价值，反馈推动词元能力进化">${common}<div class="diagram-grid value-grid"><div class="result-stack"><div class="node-box node-result verified-result">可验证业务结果</div><div class="node-box">事实与证据</div><div class="node-box node-trust">责任与过程</div><div class="node-box node-human">成本与价值确认</div></div><div class="value-ladder"><div class="value-rung">单点结果<small>证据可核对</small></div><div class="value-rung">组织能力沉淀<small>经验可复用</small></div><div class="value-rung">更多场景与长期价值<small>价值可验证</small></div><div class="value-rung feedback-return">↩ 反馈 → 评估 → 词元进化</div></div></div></div>`;
    }

    function renderSection(section, index) {
      return `<section class="chapter${index===state.chapter?' is-active':''}" id="chapter-${index}" data-rendered-section data-index="${index}" aria-labelledby="chapter-title-${index}"><div class="chapter-copy"><span class="chapter-index">CHAPTER ${String(index+1).padStart(2,'0')} / 06</span><p class="eyebrow">${escapeHtml(section.eyebrow)}</p><h2 id="chapter-title-${index}">${escapeHtml(section.title)}</h2><p class="thesis">${escapeHtml(section.thesis)}</p><ul class="value-list">${section.values.map(value=>`<li>${escapeHtml(value)}</li>`).join('')}</ul><p class="chapter-transition" data-transition>${escapeHtml(section.transition)}</p></div><div class="chapter-visual">${renderDiagram(section.diagram,state.audience,index)}</div></section>`;
    }

    function renderAudience(key) {
      if (!['investor','partner','customer'].includes(key)) return;
      state.audience=key; state.chapter=0;
      const data=CONTENT[key];
      $('#brand-concept').textContent=CONTENT.brand.concept; $('#brand-positioning').textContent=CONTENT.brand.positioning; $('#brand-english').textContent=CONTENT.brand.english;
      $('#hero-eyebrow').textContent=data.hero.eyebrow; $('#hero-title').textContent=data.hero.title; $('#hero-lead').textContent=data.hero.lead; $('#hero-closing').textContent=data.hero.closing;
      $('#loop-rail').innerHTML=loopSvg(SHARED_LOOP);
      $('#chapter-stage').innerHTML=data.sections.map(renderSection).join('');
      $('#chapter-nav').innerHTML=data.sections.map((section,index)=>`<button type="button" class="chapter-button" data-chapter="${index}" ${index===0?'aria-current="step"':''}>${String(index+1).padStart(2,'0')} ${escapeHtml(section.eyebrow.split('/').pop().trim())}</button>`).join('');
      $('#cta-title').textContent=data.cta.title; $('#cta-body').textContent=data.cta.body; $('#cta-action').textContent=data.cta.action;
      $$('.audience-tab').forEach(tab=>tab.setAttribute('aria-selected',String(tab.dataset.audience===key)));
      bindChapterButtons(); updateChapterState();
    }

    function setChapter(index) {
      const sections=CONTENT[state.audience].sections;
      const safe=Math.max(0,Math.min(Number(index)||0,sections.length-1));
      state.chapter=safe;
      $$('.chapter').forEach((section,i)=>section.classList.toggle('is-active',i===safe));
      $$('.chapter-button').forEach((button,i)=>i===safe?button.setAttribute('aria-current','step'):button.removeAttribute('aria-current'));
      updateChapterState();
      if(state.mode==='browse') document.querySelector(`#chapter-${safe}`)?.scrollIntoView({behavior:'smooth',block:'start'});
    }

    function setMode(mode) {
      if(!['browse','present'].includes(mode)) return;
      state.mode=mode; document.body.dataset.mode=mode;
      $('#browse-mode').setAttribute('aria-pressed',String(mode==='browse')); $('#present-mode').setAttribute('aria-pressed',String(mode==='present'));
      updateChapterState();
      if(mode==='present') window.scrollTo({top:0,behavior:'smooth'});
    }

    function updateChapterState(){
      $('#prev-chapter').disabled=state.chapter===0; $('#next-chapter').disabled=state.chapter===CONTENT[state.audience].sections.length-1;
      $$('.chapter').forEach((section,i)=>section.classList.toggle('is-active',i===state.chapter));
    }
    function bindChapterButtons(){ $$('.chapter-button').forEach(button=>button.addEventListener('click',()=>setChapter(Number(button.dataset.chapter)))); }
    $$('.audience-tab').forEach((tab,index,tabs)=>{
      tab.addEventListener('click',()=>renderAudience(tab.dataset.audience));
      tab.addEventListener('keydown',(event)=>{ if(!['ArrowLeft','ArrowRight'].includes(event.key)) return; event.preventDefault(); const direction=event.key==='ArrowRight'?1:-1; const next=tabs[(index+direction+tabs.length)%tabs.length]; next.focus(); renderAudience(next.dataset.audience); });
    });
    $('#browse-mode').addEventListener('click',()=>setMode('browse')); $('#present-mode').addEventListener('click',()=>setMode('present'));
    $('#prev-chapter').addEventListener('click',()=>setChapter(state.chapter-1)); $('#next-chapter').addEventListener('click',()=>setChapter(state.chapter+1));
    renderAudience('investor'); setMode('browse');
  </script>
</body>
</html>
