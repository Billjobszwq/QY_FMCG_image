<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKU 识别工作台</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--panel:#121d33;--panel2:#16233d;--line:#223354;--ink:#e8eef9;--dim:#7d8fb3;--cyan:#38bdf8;--green:#34d399;--amber:#fbbf24;--rose:#fb7185;--violet:#a78bfa;--disp:'Space Grotesk',sans-serif;--mono:'IBM Plex Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--mono);background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(ellipse 800px 400px at 90% -10%,rgba(56,189,248,.08),transparent 60%),radial-gradient(ellipse 600px 400px at -5% 100%,rgba(52,211,153,.06),transparent 60%)}
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;background:rgba(11,18,32,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top h1{font-family:var(--disp);font-size:20px;font-weight:700}
.top h1 b{color:var(--cyan)}
.top .meta{margin-left:auto;font-size:11.5px;color:var(--dim)}
.wrap{max-width:1300px;margin:0 auto;padding:22px 26px;display:grid;grid-template-columns:1fr 360px;gap:18px}
.canvas-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative}
.canvas-wrap{position:relative;display:inline-block;max-width:100%;line-height:0}
#img{max-width:100%;max-height:78vh;border-radius:8px;display:block}
#overlay{position:absolute;top:0;left:0;pointer-events:none}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
label{font-size:11px;color:var(--dim);display:block;margin-bottom:6px}
select,input[type=file],button{width:100%;font-family:var(--mono);font-size:13px}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:12px}
input[type=range]{width:100%;accent-color:var(--cyan);margin:4px 0 12px}
button{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06121f;border:none;border-radius:8px;padding:11px;font-weight:600;cursor:pointer;font-family:var(--disp);transition:transform .15s,filter .2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
button.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.conf-val{font-family:var(--disp);font-size:15px;font-weight:600;color:var(--cyan)}
.results{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:12px;cursor:pointer;transition:border-color .15s}
.ritem:hover{border-color:var(--cyan)}
.ritem .swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.ritem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .cf{font-family:var(--disp);font-weight:600}
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .v{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--cyan)}
.stat .l{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:30px 0}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:12px;background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.4)}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <h1>SKU<b>识别</b>工作台</h1>
  <span class="badge" id="modelBadge">模型加载中</span>
  <div class="meta" id="metaInfo">YOLO26M · 208 SKU</div>
</div>
<div class="wrap">
  <div class="canvas-card">
    <div class="canvas-wrap">
      <img id="img" alt="选择照片后显示">
      <canvas id="overlay"></canvas>
    </div>
    <div class="empty" id="placeholder">从右侧选择一张货架照片，或上传本地图片开始识别</div>
  </div>
  <div class="side">
    <div class="card">
      <h3>识别输入</h3>
      <label>选择训练集照片</label>
      <select id="photoSel"><option value="">-- 加载中 --</option></select>
      <label>或上传本地图片</label>
      <input type="file" id="fileIn" accept="image/*" style="margin-bottom:12px">
      <label>置信度阈值 <span class="conf-val" id="confVal">0.25</span></label>
      <input type="range" id="confRange" min="0.05" max="0.8" step="0.05" value="0.25">
      <button id="runBtn">开始识别</button>
    </div>
    <div class="card">
      <h3>识别结果</h3>
      <div class="stat-row">
        <div class="stat"><div class="v" id="cntVal">0</div><div class="l">检出商品</div></div>
        <div class="stat"><div class="v" id="msVal">0</div><div class="l">耗时(ms)</div></div>
      </div>
      <div class="results" id="results"><div class="empty">尚无结果</div></div>
      <button class="ghost" id="dlBtn" style="margin-top:12px;display:none">下载结果 (JSON)</button>
    </div>
  </div>
</div>
<script>
const API='';let lastProducts=[],curImage=null;
const palette=['#38bdf8','#34d399','#fbbf24','#fb7185','#a78bfa','#60a5fa','#f472b6','#4ade80','#facc15','#22d3ee'];
function colorFor(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;return palette[h%palette.length]}
// RA-020：所有动态名称插入 innerHTML 前必须转义，防 XSS
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function init(){
  try{
    const h=await fetch('/recognize/health').then(r=>r.json());
    document.getElementById('modelBadge').textContent='模型: '+(h.model||'sku_v1');
  }catch(e){}
  try{
    const ps=await fetch('/recognize/photos').then(r=>r.json());
    const sel=document.getElementById('photoSel');
    sel.innerHTML='<option value="">-- 选择照片 --</option>'+ps.photos.map(p=>`<option value="${esc(p.id)}">${esc(p.sname||p.id)} · ${esc(p.typename||'')}</option>`).join('');
  }catch(e){document.getElementById('photoSel').innerHTML='<option value="">加载失败</option>'}
}

function loadImage(src){
  const img=document.getElementById('img');
  document.getElementById('placeholder').style.display='none';
  img.onload=()=>{const ov=document.getElementById('overlay');ov.width=img.clientWidth;ov.height=img.clientHeight;drawBoxes()};
  img.src=src;
}

document.getElementById('photoSel').addEventListener('change',e=>{
  const id=e.target.value;if(!id)return;
  curImage={type:'asset',id};
  loadImage(`/recognize/photo/${id}`);
});
document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{curImage={type:'base64',data:rd.result.split(',')[1]};loadImage(rd.result)};
  rd.readAsDataURL(f);
});
document.getElementById('confRange').addEventListener('input',e=>{document.getElementById('confVal').textContent=parseFloat(e.target.value).toFixed(2)});

document.getElementById('runBtn').addEventListener('click',async()=>{
  if(!curImage){alert('请先选择或上传图片');return}
  const conf=parseFloat(document.getElementById('confRange').value);
  const body={conf};
  if(curImage.type==='asset')body.asset_id=curImage.id;else body.image_base64=curImage.data;
  document.getElementById('runBtn').textContent='识别中...';
  try{
    const r=await fetch('/recognize/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    lastProducts=d.products||[];
    document.getElementById('cntVal').textContent=d.count||0;
    document.getElementById('msVal').textContent=d.elapsed_ms||0;
    renderResults();drawBoxes();
    document.getElementById('dlBtn').style.display='block';
  }catch(e){alert('识别失败: '+e.message)}
  document.getElementById('runBtn').textContent='开始识别';
});

function renderResults(){
  const el=document.getElementById('results');
  if(!lastProducts.length){el.innerHTML='<div class="empty">未检出商品（可降低置信度阈值）</div>';return}
  el.innerHTML=lastProducts.map((p,i)=>`<div class="ritem" onmouseenter="highlight(${i})" onmouseleave="drawBoxes()">
    <span class="swatch" style="background:${colorFor(p.name)}"></span>
    <span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>
    <span class="cf" style="color:${colorFor(p.name)}">${(p.confidence*100).toFixed(0)}%</span></div>`).join('');
}

function drawBoxes(hi=-1){
  const img=document.getElementById('img'),ov=document.getElementById('overlay');
  if(!img.clientWidth)return;
  ov.width=img.clientWidth;ov.height=img.clientHeight;
  const ctx=ov.getContext('2d');ctx.clearRect(0,0,ov.width,ov.height);
  const sx=img.clientWidth/img.naturalWidth,sy=img.clientHeight/img.naturalHeight;
  lastProducts.forEach((p,i)=>{
    const[x1,y1,x2,y2]=p.box;const c=colorFor(p.name);
    ctx.lineWidth=(i===hi)?4:2.5;ctx.strokeStyle=c;
    ctx.strokeRect(x1*sx,y1*sy,(x2-x1)*sx,(y2-y1)*sy);
    const label=`${p.name} ${(p.confidence*100).toFixed(0)}%`;
    ctx.font='600 12px "IBM Plex Mono"';const tw=ctx.measureText(label).width;
    ctx.fillStyle=c;ctx.fillRect(x1*sx,y1*sy-18,tw+10,18);
    ctx.fillStyle='#06121f';ctx.fillText(label,x1*sx+5,y1*sy-5);
  });
}
function highlight(i){drawBoxes(i)}

document.getElementById('dlBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({products:lastProducts},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='recognize_result.json';a.click();
});
init();
</script>
</body>
</html>
